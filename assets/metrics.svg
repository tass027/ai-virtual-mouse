<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 116" width="1000" height="116" role="img" aria-label="Performance metrics">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a29"/><stop offset="1" stop-color="#2b0e52"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
</defs>
<rect x="0" y="0" width="232" height="116" rx="14" fill="url(#bg)"/><rect x="0" y="0" width="232" height="5" rx="2.5" fill="url(#accent)"/><text x="116.0" y="62" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">30+</text><text x="116.0" y="90" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c4b5fd">Frames per second</text><rect x="256" y="0" width="232" height="116" rx="14" fill="url(#bg)"/><rect x="256" y="0" width="232" height="5" rx="2.5" fill="url(#accent)"/><text x="372.0" y="62" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">&lt; 50 ms</text><text x="372.0" y="90" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c4b5fd">Gesture-to-action latency</text><rect x="512" y="0" width="232" height="116" rx="14" fill="url(#bg)"/><rect x="512" y="0" width="232" height="5" rx="2.5" fill="url(#accent)"/><text x="628.0" y="62" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">95%+</text><text x="628.0" y="90" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c4b5fd">Gesture recognition rate</text><rect x="768" y="0" width="232" height="116" rx="14" fill="url(#bg)"/><rect x="768" y="0" width="232" height="5" rx="2.5" fill="url(#accent)"/><text x="884.0" y="62" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">30-80 cm</text><text x="884.0" y="90" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c4b5fd">Optimal tracking range</text>
</svg>