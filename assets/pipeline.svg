<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Processing pipeline">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a29"/><stop offset="1" stop-color="#2b0e52"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
</defs>
<rect width="1000" height="150" rx="16" fill="url(#bg)"/>
<text x="500" y="24" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#a78bfa" opacity="0">PROCESSING PIPELINE</text>
<line x1="10" y1="18" x2="990" y2="18" stroke="#7c3aed" stroke-opacity="0.35" stroke-dasharray="3 6"/>
<circle r="4.5" fill="#ec4899"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M10 18 H990"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="6s" begin="0s" repeatCount="indefinite"/></circle><circle r="4.5" fill="#ec4899"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M10 18 H990"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="6s" begin="2s" repeatCount="indefinite"/></circle><circle r="4.5" fill="#ec4899"><animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M10 18 H990"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="6s" begin="4s" repeatCount="indefinite"/></circle>
<rect x="2" y="46" width="146" height="78" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7c3aed" stroke-opacity="0.7"/><rect x="2" y="46" width="146" height="4" rx="2" fill="url(#accent)"/><text x="75.0" y="82" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Webcam</text><text x="75.0" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#c4b5fd">Video stream</text><path d="M152 85 H166 M161 80 L167 85 L161 90" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="172" y="46" width="146" height="78" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7c3aed" stroke-opacity="0.7"/><rect x="172" y="46" width="146" height="4" rx="2" fill="url(#accent)"/><text x="245.0" y="82" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">OpenCV</text><text x="245.0" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#c4b5fd">Frame capture</text><path d="M322 85 H336 M331 80 L337 85 L331 90" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="342" y="46" width="146" height="78" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7c3aed" stroke-opacity="0.7"/><rect x="342" y="46" width="146" height="4" rx="2" fill="url(#accent)"/><text x="415.0" y="82" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">MediaPipe</text><text x="415.0" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#c4b5fd">21 hand landmarks</text><path d="M492 85 H506 M501 80 L507 85 L501 90" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="512" y="46" width="146" height="78" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7c3aed" stroke-opacity="0.7"/><rect x="512" y="46" width="146" height="4" rx="2" fill="url(#accent)"/><text x="585.0" y="82" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Gesture recognition</text><text x="585.0" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#c4b5fd">Finger position analysis</text><path d="M662 85 H676 M671 80 L677 85 L671 90" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="682" y="46" width="146" height="78" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7c3aed" stroke-opacity="0.7"/><rect x="682" y="46" width="146" height="4" rx="2" fill="url(#accent)"/><text x="755.0" y="82" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Action mapping</text><text x="755.0" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#c4b5fd">Cursor, click, volume</text><path d="M832 85 H846 M841 80 L847 85 L841 90" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="852" y="46" width="146" height="78" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7c3aed" stroke-opacity="0.7"/><rect x="852" y="46" width="146" height="4" rx="2" fill="url(#accent)"/><text x="925.0" y="82" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">System control</text><text x="925.0" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#c4b5fd">PyAutoGUI, Pycaw</text>
<text x="500" y="144" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9ca3af">Each frame runs through the full pipeline in real time</text>
</svg>